# CI do Sentavos: nada chega na main sem passar por aqui.
#
# Três jobs independentes — testes do backend, migrações em Postgres de
# verdade e o front. Nenhum dado real: os testes usam SQLite em memória e a
# migração usa uma fixture fictícia (app/tests/fixtures/base_0007.json).
name: ci

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalação limpa
        run: uv sync --frozen
      - name: Testes
        run: uv run pytest -q

  migracoes:
    name: migrações (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Vazio → head → 0007 → head; fixture 0007 → head
        run: uv run python -m scripts.ci_migracoes postgresql://postgres:postgres@localhost:5432

  frontend:
    name: frontend (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
