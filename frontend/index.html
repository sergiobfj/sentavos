<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0D08" />
    <meta name="description" content="Controle financeiro pessoal: cada centavo no seu lugar." />

    <!-- Instalação na tela inicial. Sem o manifest o atalho vira só um favorito:
         ícone genérico e barra do navegador em cima da tela toda vez. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- O iOS ignora o manifest: ele quer estas três meta-tags pra abrir em tela
         cheia, e um PNG próprio porque não usa o ícone declarado lá. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sentavos" />

    <title>Sentavos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
